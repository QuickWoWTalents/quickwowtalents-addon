name: Pull request checks

on:
  pull_request:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  QWT_TALENT_CATALOG_PATH: ${{ github.workspace }}/tmp/release-inputs/talent-catalog.json.gz
  QWT_ADDON_OPTIONS_PATH: ${{ github.workspace }}/tmp/release-inputs/options.json
  QWT_RELEASE_INPUT_MANIFEST_PATH: ${{ github.workspace }}/tmp/release-inputs/snapshot-manifest.json
  QWT_ADDON_DATA_URL: https://quickwowtalents.com/api/addon-data
  QWT_OPTIONS_URL: https://quickwowtalents.com/api/options

jobs:
  test:
    name: Validate production data, test, and package
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # setup-node does not update the separate Node binary used by JavaScript actions.
      # Bootstrap that binary before checkout/setup-node and retain it for post actions.
      - name: Protect the GitHub Actions Node runtime
        id: bootstrap_actions_node
        shell: bash
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT:$RUNNER_OS:$RUNNER_ARCH" = 'github-hosted:Linux:X64' ]
          [ -z "${ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION:-}" ]
          RUNTIME_DIR="$(mktemp -d "$RUNNER_TEMP/qwt-node.XXXXXX")"
          NODE_ARCHIVE="$RUNTIME_DIR/node.tar.xz"
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
            --connect-timeout 15 --max-time 120 --retry 2 --retry-max-time 300 \
            https://nodejs.org/dist/v24.22.1/node-v24.22.1-linux-x64.tar.xz \
            --output "$NODE_ARCHIVE"
          printf '%s  %s\n' '6c172a9ab6718f7b801fb5a7bd486af2ee5e32758086a04b84fcce2aa77095e6' "$NODE_ARCHIVE" | sha256sum --check --status
          tar -xJf "$NODE_ARCHIVE" -C "$RUNTIME_DIR"
          PATCHED_NODE="$RUNTIME_DIR/node-v24.22.1-linux-x64/bin/node"
          [ "$("$PATCHED_NODE" --version)" = 'v24.22.1' ]

          # Resolve this job's Runner.Worker executable without assuming a runner path.
          WORKER_PID="$PPID"
          RUNNER_ROOT=''
          while [ "$WORKER_PID" -gt 1 ]; do
            WORKER_EXE="$(readlink -f "/proc/$WORKER_PID/exe")"
            if [ "$(basename "$WORKER_EXE")" = 'Runner.Worker' ]; then
              RUNNER_ROOT="$(dirname "$(dirname "$WORKER_EXE")")"
              break
            fi
            WORKER_PID="$(ps -o ppid= -p "$WORKER_PID" | tr -d ' ')"
          done
          [ -n "$RUNNER_ROOT" ]
          ACTIONS_NODE="$RUNNER_ROOT/externals/node24/bin/node"
          [ -f "$ACTIONS_NODE" ] && [ ! -L "$ACTIONS_NODE" ]
          printf 'Actions Node before: %s (%s)\n' "$("$ACTIONS_NODE" --version)" "$ACTIONS_NODE"
          install -m 755 "$PATCHED_NODE" "$ACTIONS_NODE.qwt"
          mv -f "$ACTIONS_NODE.qwt" "$ACTIONS_NODE"
          [ "$("$ACTIONS_NODE" --version)" = 'v24.22.1' ]
          printf 'Actions Node after: %s (%s)\n' "$("$ACTIONS_NODE" --version)" "$ACTIONS_NODE"
          printf 'runner_node=%s\n' "$ACTIONS_NODE" >> "$GITHUB_OUTPUT"

      - name: Check out addon repository
        id: checkout_addon
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, node24
        with:
          persist-credentials: false

      - name: Set up Node
        id: setup_node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6, node24
        with:
          node-version: '24.22.1'
          package-manager-cache: false

      - name: Install and verify protected hosted HTTPS runtimes
        id: verify_hosted_runtimes
        shell: bash
        env:
          ACTIONS_NODE: ${{ steps.bootstrap_actions_node.outputs.runner_node }}
        run: bash .github/scripts/install-hosted-runtimes.sh

      - name: Install dependencies
        id: install_dependencies
        run: npm ci

      - name: Verify addon checkout
        id: verify_addon_checkout
        shell: bash
        run: |
          set -euo pipefail
          ADDON_STATUS="$(git status --porcelain --untracked-files=all)"
          if [ -n "$ADDON_STATUS" ]; then
            echo 'Addon checkout must be clean before release inputs are acquired.' >&2
            exit 1
          fi
          BASE_HEAD="$(git rev-parse HEAD)"
          if [[ ! "$BASE_HEAD" =~ ^([0-9a-f]{40}|[0-9a-f]{64})$ ]]; then
            echo 'Addon checkout HEAD is not a valid Git object ID.' >&2
            exit 1
          fi
          echo "head=$BASE_HEAD" >> "$GITHUB_OUTPUT"

      - name: Acquire production addon inputs
        id: acquire_inputs
        env:
          QWT_ADDON_DATA_TIMEOUT_MS: '45000'
          QWT_ADDON_DATA_RETRIES: '2'
          QWT_ADDON_DATA_RETRY_DELAY_MS: '15000'
        run: |
          set -euo pipefail
          npm run build:data:download -- \
            --url "$QWT_ADDON_DATA_URL" \
            --options-url "$QWT_OPTIONS_URL" \
            --options-output "$QWT_ADDON_OPTIONS_PATH" \
            --catalog-output "$QWT_TALENT_CATALOG_PATH" \
            --snapshot-manifest-output "$QWT_RELEASE_INPUT_MANIFEST_PATH" \
            --output "$GITHUB_WORKSPACE/QuickWoWTalentsData.lua"

      - name: Validate downloaded addon data
        id: validate_data
        run: |
          set -euo pipefail
          npm run validate:data -- \
            --addon "$GITHUB_WORKSPACE/QuickWoWTalentsData.lua" \
            --options "$QWT_ADDON_OPTIONS_PATH" \
            --catalog "$QWT_TALENT_CATALOG_PATH" \
            --snapshot-manifest "$QWT_RELEASE_INPUT_MANIFEST_PATH" \
            --require-catalog-download

      - name: Verify scripts and run tests
        id: verify_code
        run: |
          set -euo pipefail
          node --check scripts/build-data.mjs
          node --check scripts/catalog-download-contract.mjs
          node --check scripts/download-addon-data.mjs
          node --check scripts/package-addon.mjs
          node --check scripts/prepare-release.mjs
          node --check scripts/release-input-snapshot.mjs
          node --check scripts/validate-addon-contract.mjs
          node --check scripts/verify-github-release-asset.mjs
          node --check scripts/verify-release-readiness.mjs
          npm test

      - name: Package addon zip
        id: package_addon
        run: npm run package

      - name: Verify source and package readiness
        id: readiness
        run: |
          set -euo pipefail
          npm run release:verify -- \
            --options "$QWT_ADDON_OPTIONS_PATH" \
            --catalog "$QWT_TALENT_CATALOG_PATH" \
            --snapshot-manifest "$QWT_RELEASE_INPUT_MANIFEST_PATH" \
            --require-catalog-download
