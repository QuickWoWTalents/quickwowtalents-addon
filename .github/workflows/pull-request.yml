name: Pull request checks

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test and package
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check scripts and run tests
        run: |
          node --check scripts/build-data.mjs
          node --check scripts/download-addon-data.mjs
          node --check scripts/package-addon.mjs
          node --check scripts/prepare-release.mjs
          node --check scripts/verify-release-readiness.mjs
          npm test

      - name: Package addon
        run: npm run package

      - name: Verify release readiness
        run: npm run release:verify
