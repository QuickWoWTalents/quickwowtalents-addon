name: Daily addon release

on:
  repository_dispatch:
    types: [daily-release-fallback]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Package and verify the current addon without versioning or publishing.'
        required: true
        default: true
        type: boolean
      version:
        description: 'Optional explicit semver version for non-dry-run releases, e.g. 1.1.0. Defaults to next patch.'
        required: false
        type: string

permissions:
  actions: read
  contents: write

concurrency:
  group: daily-addon-release
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  QWT_TALENT_CATALOG_PATH: ${{ github.workspace }}/tmp/release-inputs/talent-catalog.json.gz
  QWT_ADDON_OPTIONS_PATH: ${{ github.workspace }}/tmp/release-inputs/options.json
  QWT_RELEASE_INPUT_MANIFEST_PATH: ${{ github.workspace }}/tmp/release-inputs/snapshot-manifest.json
  QWT_ADDON_DATA_URL: https://quickwowtalents.com/api/addon-data
  QWT_OPTIONS_URL: https://quickwowtalents.com/api/options

jobs:
  release:
    name: Validate current data and publish a verified release
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # setup-node does not update the separate Node binary used by JavaScript actions.
      # Bootstrap that binary before checkout/setup-node and retain it for post actions.
      - name: Protect the GitHub Actions Node runtime
        id: bootstrap_actions_node
        shell: bash
        run: |
          set -euo pipefail
          [ "$RUNNER_ENVIRONMENT:$RUNNER_OS:$RUNNER_ARCH" = 'github-hosted:Linux:X64' ]
          [ -z "${ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION:-}" ]
          [ "${GIT_SSL_NO_VERIFY+x}" != x ] || { echo 'GIT_SSL_NO_VERIFY must be absent; any value disables verification.' >&2; exit 1; }
          RUNTIME_DIR="$(mktemp -d "$RUNNER_TEMP/qwt-node.XXXXXX")"
          NODE_ARCHIVE="$RUNTIME_DIR/node.tar.xz"
          curl --disable --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
            --connect-timeout 15 --max-time 120 --retry 2 --retry-max-time 300 \
            https://nodejs.org/dist/v24.22.1/node-v24.22.1-linux-x64.tar.xz \
            --output "$NODE_ARCHIVE"
          printf '%s  %s\n' '6c172a9ab6718f7b801fb5a7bd486af2ee5e32758086a04b84fcce2aa77095e6' "$NODE_ARCHIVE" | sha256sum --check --status
          tar -xJf "$NODE_ARCHIVE" -C "$RUNTIME_DIR"
          PATCHED_NODE="$RUNTIME_DIR/node-v24.22.1-linux-x64/bin/node"
          [ "$("$PATCHED_NODE" --version)" = 'v24.22.1' ]

          # Isolate Git/curl from the hosted image's older CA package before checkout.
          CA_BUNDLE="$RUNTIME_DIR/ca-bundle.pem"
          CA_EMPTY_PATH="$RUNTIME_DIR/empty-ca"
          mkdir -m 700 "$CA_EMPTY_PATH"
          "$PATCHED_NODE" --input-type=module - "$CA_BUNDLE" "$CA_EMPTY_PATH" "$GITHUB_ENV" <<'NODE'
          import assert from 'node:assert/strict';
          import { X509Certificate, createHash } from 'node:crypto';
          import { appendFileSync, writeFileSync } from 'node:fs';
          import { rootCertificates } from 'node:tls';

          const [bundlePath, emptyPath, envPath] = process.argv.slice(2);
          const blockedSubjects = new Set(['emSign Root TLS CA - G3', 'emSign Root CS CA - G3', 'emSign ECC Root CA - G3', 'AAA Certificate Services']);
          const blockedFingerprints = new Set([
            '7DD78D5F4F13459A83DFF9ABBBA62EDBAF6F2D102BF257FD712F4D9F2746ED8D',
            'F2EDAAFF3D9B701FB4D14C9F285F8C0BAD90FC3BCC1FA07D47F4718EDABA34A5',
            '86A1ECBA089C4A8D3BBE2734C612BA341D813E043CF9E8A862CD5C57A36BBE6B',
            'D7A7A0FB5D7E2731D771E9484EBCDEF71D5F0C3E0A2948782BC83EE0EA699EF4',
          ]);
          const blockedRootKeys = new Set([
            'c619e4780ed8e0abeda24ad732567de4383a7ea941338f6d1a7d1b49ac792fe9',
            '0a6c2b2ca5b364207954171987ac9d2178561569d8205457e77ca90c32ede282',
            '8d417db2dd8bf5e3084d1e3f196d583849d81bdd4c00c70b9d39369e96b8c782',
            'bd153ed7b0434f6886b17bce8bbe84ed340c7132d702a8f4fa318f756ecbd6f3',
          ]);
          assert.equal(rootCertificates.length, 118, 'Unexpected pinned Node CA count');
          for (const pem of rootCertificates) {
            const certificate = new X509Certificate(pem);
            const commonName = certificate.subject.split('\n').find((part) => part.startsWith('CN='))?.slice(3);
            assert.equal(blockedSubjects.has(commonName), false, `Distrusted CA subject: ${commonName}`);
            assert.equal(blockedFingerprints.has(certificate.fingerprint256.replaceAll(':', '')), false, 'Distrusted CA fingerprint');
            const keyHash = createHash('sha256').update(certificate.publicKey.export({ type: 'spki', format: 'der' })).digest('hex');
            assert.equal(blockedRootKeys.has(keyHash), false, 'Distrusted CA public key');
          }
          const bundle = rootCertificates.join('\n') + '\n';
          const sha256 = createHash('sha256').update(bundle).digest('hex');
          assert.equal(sha256, '15783a17671365196e5e4ba6ddea3132df72538fef70be91bbd91f45c85c170f', 'Unexpected pinned Node CA bundle');
          writeFileSync(bundlePath, bundle, { mode: 0o600, flag: 'wx' });
          appendFileSync(envPath, [
            `GIT_SSL_CAINFO=${bundlePath}`, `GIT_SSL_CAPATH=${emptyPath}`,
            `CURL_CA_BUNDLE=${bundlePath}`, `SSL_CERT_FILE=${bundlePath}`, `SSL_CERT_DIR=${emptyPath}`,
          ].join('\n') + '\n');
          console.log(`Task CA bundle: Node ${process.version}, NSS 3.131.1, roots=${rootCertificates.length}, sha256=${sha256}`);
          console.log('Distrusted emSign TLS G3, CS G3, ECC G3 and AAA subjects/fingerprints/public keys: absent');
          NODE

          # Resolve this job's Runner.Worker executable without assuming a runner path.
          WORKER_PID="$PPID"
          RUNNER_ROOT=''
          while [ "$WORKER_PID" -gt 1 ]; do
            WORKER_EXE="$(readlink -f "/proc/$WORKER_PID/exe")"
            if [ "$(basename "$WORKER_EXE")" = 'Runner.Worker' ]; then
              RUNNER_ROOT="$(dirname "$(dirname "$WORKER_EXE")")"
              break
            fi
            WORKER_PID="$(ps -o ppid= -p "$WORKER_PID" | tr -d ' ')"
          done
          [ -n "$RUNNER_ROOT" ]
          ACTIONS_NODE="$RUNNER_ROOT/externals/node24/bin/node"
          [ -f "$ACTIONS_NODE" ] && [ ! -L "$ACTIONS_NODE" ]
          printf 'Actions Node before: %s (%s)\n' "$("$ACTIONS_NODE" --version)" "$ACTIONS_NODE"
          install -m 755 "$PATCHED_NODE" "$ACTIONS_NODE.qwt"
          mv -f "$ACTIONS_NODE.qwt" "$ACTIONS_NODE"
          [ "$("$ACTIONS_NODE" --version)" = 'v24.22.1' ]
          printf 'Actions Node after: %s (%s)\n' "$("$ACTIONS_NODE" --version)" "$ACTIONS_NODE"
          printf 'runner_node=%s\n' "$ACTIONS_NODE" >> "$GITHUB_OUTPUT"

      - name: Check out addon repository
        id: checkout_addon
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, node24
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        id: setup_node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6, node24
        with:
          node-version: '24.22.1'
          package-manager-cache: false

      - name: Install and verify protected hosted HTTPS runtimes
        id: verify_hosted_runtimes
        shell: bash
        env:
          ACTIONS_NODE: ${{ steps.bootstrap_actions_node.outputs.runner_node }}
        run: bash .github/scripts/install-hosted-runtimes.sh

      - name: Install dependencies
        id: install_dependencies
        run: npm ci

      - name: Verify addon checkout
        id: verify_addon_checkout
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$(git status --porcelain --untracked-files=all)" ]; then
            echo 'Addon checkout must be clean before release inputs are acquired.' >&2
            exit 1
          fi
          BASE_HEAD="$(git rev-parse HEAD)"
          [[ "$BASE_HEAD" =~ ^([0-9a-f]{40}|[0-9a-f]{64})$ ]] || exit 1
          echo "head=$BASE_HEAD" >> "$GITHUB_OUTPUT"

      - name: Acquire production addon inputs
        id: acquire_inputs
        env:
          QWT_ADDON_DATA_TIMEOUT_MS: '45000'
          QWT_ADDON_DATA_RETRIES: '2'
          QWT_ADDON_DATA_RETRY_DELAY_MS: '30000'
        run: |
          set -euo pipefail
          npm run build:data:download -- \
            --url "$QWT_ADDON_DATA_URL" \
            --options-url "$QWT_OPTIONS_URL" \
            --options-output "$QWT_ADDON_OPTIONS_PATH" \
            --catalog-output "$QWT_TALENT_CATALOG_PATH" \
            --snapshot-manifest-output "$QWT_RELEASE_INPUT_MANIFEST_PATH" \
            --output "$GITHUB_WORKSPACE/QuickWoWTalentsData.lua"

      - name: Run repository tests
        id: verify_code
        run: npm test

      - name: Select release mode
        id: release_gate
        env:
          BASE_HEAD: ${{ steps.verify_addon_checkout.outputs.head }}
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == true }}
        run: |
          set -euo pipefail
          fail() { echo "$1" >&2; exit "${2:-1}"; }
          if [ "$EVENT_NAME:$DRY_RUN" = 'workflow_dispatch:true' ]; then
            echo 'mode=dry-run' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          case "$EVENT_NAME:$DRY_RUN" in
            workflow_dispatch:false|repository_dispatch:false) ;;
            *) fail 'Release event and dry-run inputs are not an allowed combination.' ;;
          esac
          [ "$GITHUB_REF" = 'refs/heads/main' ] || fail 'Publishing is allowed only from refs/heads/main.'

          CURRENT_HEAD="$(git rev-parse HEAD)"
          [ "$CURRENT_HEAD" = "$BASE_HEAD" ] || fail 'Addon checkout base HEAD changed during validation.'
          REMOTE_MAIN_RECORD="$(git ls-remote --exit-code origin refs/heads/main)"
          read -r REMOTE_MAIN_HEAD REMOTE_MAIN_REF <<< "$REMOTE_MAIN_RECORD"
          if [ "$REMOTE_MAIN_REF" != 'refs/heads/main' ] || \
             [[ ! "$REMOTE_MAIN_HEAD" =~ ^([0-9a-f]{40}|[0-9a-f]{64})$ ]]; then
            fail 'Fresh origin/main lookup did not return one valid main ref.'
          fi
          [ "$BASE_HEAD" = "$REMOTE_MAIN_HEAD" ] || fail 'Addon checkout base HEAD does not match fresh remote main.'

          if [ "$EVENT_NAME" = 'repository_dispatch' ]; then
            DAILY_PUBLICATION="$(node scripts/check-daily-publication.mjs)"
            case "$DAILY_PUBLICATION" in
              already-published)
                echo 'mode=no-op' >> "$GITHUB_OUTPUT"
                exit 0
                ;;
              not-published) ;;
              *) fail 'Daily publication check returned an invalid decision.' ;;
            esac
          fi

          if [ "$EVENT_NAME" = 'workflow_dispatch' ]; then
            MODE='publish'
          elif git diff --quiet HEAD -- QuickWoWTalentsData.lua; then
            VERSION="$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version")"
            [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || fail 'package.json version must be plain semver.'
            TAG_HEAD="$(git rev-parse --verify --quiet "refs/tags/v$VERSION^{commit}" || true)"
            if [ "$TAG_HEAD" = "$CURRENT_HEAD" ]; then MODE='reconcile'; else MODE='no-op'; fi
          else
            DIFF_STATUS="$?"
            [ "$DIFF_STATUS" -eq 1 ] || fail 'Could not compare validated addon data with committed HEAD.' "$DIFF_STATUS"
            MODE='publish'
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"

      - name: Prepare next addon version
        id: prepare_version
        if: ${{ steps.release_gate.outputs.mode == 'publish' }}
        env:
          RELEASE_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          if [ -n "$RELEASE_VERSION" ]; then
            npm run release:prepare -- --version "$RELEASE_VERSION"
          else
            npm run release:prepare
          fi

      - name: Resolve release version
        id: resolve_version
        if: ${{ steps.release_gate.outputs.mode != 'no-op' }}
        run: |
          set -euo pipefail
          VERSION="$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version")"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'package.json version must be plain semver.' >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "zip=dist/QuickWoWTalents-$VERSION.zip" >> "$GITHUB_OUTPUT"

      - name: Fail if tag already exists
        id: protect_tag
        if: ${{ steps.release_gate.outputs.mode == 'publish' }}
        env:
          RELEASE_TAG: ${{ steps.resolve_version.outputs.tag }}
        run: |
          set -euo pipefail
          fail() { echo "$1" >&2; exit "${2:-1}"; }
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            fail "Tag $RELEASE_TAG already exists; refusing to overwrite a release."
          elif [ "$?" -ne 1 ]; then
            fail 'Could not determine whether the release tag exists locally.'
          fi
          REMOTE_TAG="$(git ls-remote --refs origin "refs/tags/$RELEASE_TAG")"
          [ -z "$REMOTE_TAG" ] || fail "Tag $RELEASE_TAG already exists; refusing to overwrite a release."

      - name: Package addon zip
        id: package_addon
        if: ${{ steps.release_gate.outputs.mode != 'no-op' }}
        run: npm run package

      - name: Verify source and package readiness
        id: readiness
        if: ${{ steps.release_gate.outputs.mode != 'no-op' }}
        run: |
          set -euo pipefail
          READINESS_RESULT="$RUNNER_TEMP/qwt-release-readiness.json"
          npm run --silent release:verify -- \
            --options "$QWT_ADDON_OPTIONS_PATH" \
            --catalog "$QWT_TALENT_CATALOG_PATH" \
            --snapshot-manifest "$QWT_RELEASE_INPUT_MANIFEST_PATH" \
            --require-catalog-download \
            > "$READINESS_RESULT"
          node --input-type=module - "$READINESS_RESULT" "$GITHUB_OUTPUT" <<'NODE'
          import fs from 'node:fs';

          const [resultPath, outputPath] = process.argv.slice(2);
          const result = JSON.parse(fs.readFileSync(resultPath, 'utf8'));
          if (result.ok !== true || !/^[0-9a-f]{64}$/.test(result.zipSha256 ?? '')) {
            throw new Error('Release readiness did not return a valid zipSha256.');
          }
          fs.appendFileSync(outputPath, `zip_sha256=${result.zipSha256}\n`);
          console.log(`Release readiness verified for ${result.version}.`);
          NODE

      - name: Configure git author
        id: configure_git
        if: ${{ steps.release_gate.outputs.mode == 'publish' }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Commit and tag verified release
        id: commit_release
        if: ${{ steps.release_gate.outputs.mode == 'publish' }}
        env:
          RELEASE_TAG: ${{ steps.resolve_version.outputs.tag }}
        run: |
          set -euo pipefail
          git add package.json QuickWoWTalents.toc QuickWoWTalentsData.lua CHANGELOG.md CURSEFORGE_CHANGELOG.md
          git commit -m "Daily addon data release $RELEASE_TAG"
          git tag "$RELEASE_TAG"

      - name: Verify final release tree
        id: verify_release_tree
        if: ${{ steps.release_gate.outputs.mode == 'publish' || steps.release_gate.outputs.mode == 'reconcile' }}
        env:
          BASE_HEAD: ${{ steps.verify_addon_checkout.outputs.head }}
        run: |
          set -euo pipefail
          fail() { echo "$1" >&2; exit 1; }
          REMOTE_MAIN_RECORD="$(git ls-remote --exit-code origin refs/heads/main)"
          read -r REMOTE_MAIN_HEAD REMOTE_MAIN_REF <<< "$REMOTE_MAIN_RECORD"
          if [ "$REMOTE_MAIN_REF" != 'refs/heads/main' ] || [ "$REMOTE_MAIN_HEAD" != "$BASE_HEAD" ]; then
            fail 'Fresh origin/main no longer matches the captured checkout base.'
          fi
          [ -z "$(git status --porcelain --untracked-files=all)" ] || fail 'Release tree must be completely clean before publication.'
          RELEASE_HEAD="$(git rev-parse HEAD)"
          [[ "$RELEASE_HEAD" =~ ^([0-9a-f]{40}|[0-9a-f]{64})$ ]] || fail 'Release HEAD is not a valid Git object ID.'
          echo "head=$RELEASE_HEAD" >> "$GITHUB_OUTPUT"

      - name: Publish or reconcile verified release
        id: publish_release
        if: ${{ steps.release_gate.outputs.mode == 'publish' || steps.release_gate.outputs.mode == 'reconcile' }}
        env:
          EXPECTED_SHA256: ${{ steps.readiness.outputs.zip_sha256 }}
          GH_TOKEN: ${{ github.token }}
          PUBLISH_MODE: ${{ steps.release_gate.outputs.mode }}
          RELEASE_TAG: ${{ steps.resolve_version.outputs.tag }}
          RELEASE_ZIP: ${{ steps.resolve_version.outputs.zip }}
          SOURCE_COMMIT: ${{ steps.verify_release_tree.outputs.head }}
        run: |
          npm run release:publish -- \
            --mode "$PUBLISH_MODE" \
            --tag "$RELEASE_TAG" \
            --archive "$RELEASE_ZIP" \
            --expected-sha256 "$EXPECTED_SHA256" \
            --notes-file CURSEFORGE_CHANGELOG.md \
            --source-commit "$SOURCE_COMMIT"

      # Keep this separate: a completed GitHub publication still consumes the daily
      # allowance if the downstream handoff needs recovery. A later no-op can finish
      # an unclaimed handoff, but a reserved/uncertain upload must never be repeated.
      - name: Publish verified CurseForge artifact once
        id: publish_curseforge
        if: ${{ steps.release_gate.outputs.mode == 'publish' || steps.release_gate.outputs.mode == 'reconcile' || steps.release_gate.outputs.mode == 'no-op' }}
        env:
          GH_TOKEN: ${{ github.token }}
          CURSEFORGE_API_TOKEN: ${{ secrets.QWT_CURSEFORGE_UPLOAD_TOKEN }}
          QWT_CURSEFORGE_HANDOFF_ENABLED: ${{ vars.QWT_CURSEFORGE_HANDOFF_ENABLED }}
        run: |
          set -euo pipefail
          VERSION="$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version")"
          npm run release:curseforge -- --tag "v$VERSION"
