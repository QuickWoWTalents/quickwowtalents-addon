name: Daily addon release

on:
  schedule:
    # GitHub cron is UTC.
    - cron: '30 17 * * *'
    - cron: '37 20 * * *'
  repository_dispatch:
    types: [daily-release-fallback]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run every production release gate without committing, tagging, pushing, or publishing.'
        required: true
        default: true
        type: boolean
      version:
        description: 'Optional explicit semver version for non-dry-run releases, e.g. 1.1.0. Defaults to next patch.'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: daily-addon-release
  cancel-in-progress: false

env:
  QWT_TALENT_CATALOG_PATH: ${{ github.workspace }}/tmp/release-inputs/talent-catalog.json.gz
  QWT_ADDON_OPTIONS_PATH: ${{ github.workspace }}/tmp/release-inputs/options.json
  QWT_RELEASE_INPUT_MANIFEST_PATH: ${{ github.workspace }}/tmp/release-inputs/snapshot-manifest.json
  QWT_ADDON_DATA_URL: https://quickwowtalents.com/api/addon-data
  QWT_OPTIONS_URL: https://quickwowtalents.com/api/options

jobs:
  release:
    name: Validate current data and publish a verified release
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out addon repository
        id: checkout_addon
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        id: setup_node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        id: install_dependencies
        run: npm ci

      - name: Verify addon checkout
        id: verify_addon_checkout
        shell: bash
        run: |
          set -euo pipefail
          ADDON_STATUS="$(git status --porcelain --untracked-files=all)"
          if [ -n "$ADDON_STATUS" ]; then
            echo 'Addon checkout must be clean before release inputs are acquired.' >&2
            exit 1
          fi
          BASE_HEAD="$(git rev-parse HEAD)"
          if [[ ! "$BASE_HEAD" =~ ^([0-9a-f]{40}|[0-9a-f]{64})$ ]]; then
            echo 'Addon checkout HEAD is not a valid Git object ID.' >&2
            exit 1
          fi
          echo "head=$BASE_HEAD" >> "$GITHUB_OUTPUT"

      - name: Acquire production addon inputs
        id: acquire_inputs
        env:
          QWT_ADDON_DATA_TIMEOUT_MS: '45000'
          QWT_ADDON_DATA_RETRIES: '6'
          QWT_ADDON_DATA_RETRY_DELAY_MS: '300000'
        run: |
          set -euo pipefail
          npm run build:data:download -- \
            --url "$QWT_ADDON_DATA_URL" \
            --options-url "$QWT_OPTIONS_URL" \
            --options-output "$QWT_ADDON_OPTIONS_PATH" \
            --catalog-output "$QWT_TALENT_CATALOG_PATH" \
            --snapshot-manifest-output "$QWT_RELEASE_INPUT_MANIFEST_PATH" \
            --output "$GITHUB_WORKSPACE/QuickWoWTalentsData.lua"

      - name: Validate downloaded addon data
        id: validate_data
        run: |
          set -euo pipefail
          npm run validate:data -- \
            --addon "$GITHUB_WORKSPACE/QuickWoWTalentsData.lua" \
            --options "$QWT_ADDON_OPTIONS_PATH" \
            --catalog "$QWT_TALENT_CATALOG_PATH" \
            --snapshot-manifest "$QWT_RELEASE_INPUT_MANIFEST_PATH" \
            --require-catalog-download

      - name: Verify scripts and run tests
        id: verify_code
        run: |
          set -euo pipefail
          node --check scripts/build-data.mjs
          node --check scripts/catalog-download-contract.mjs
          node --check scripts/download-addon-data.mjs
          node --check scripts/package-addon.mjs
          node --check scripts/prepare-release.mjs
          node --check scripts/release-input-snapshot.mjs
          node --check scripts/validate-addon-contract.mjs
          node --check scripts/verify-github-release-asset.mjs
          node --check scripts/verify-release-readiness.mjs
          npm test

      - name: Decide whether to continue release
        id: release_gate
        env:
          BASE_HEAD: ${{ steps.verify_addon_checkout.outputs.head }}
          EVENT_NAME: ${{ github.event_name }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == true }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME:$DRY_RUN" in
            workflow_dispatch:true)
              echo 'continue=true' >> "$GITHUB_OUTPUT"
              echo 'publish=false' >> "$GITHUB_OUTPUT"
              echo 'repair=false' >> "$GITHUB_OUTPUT"
              echo 'reason=dry-run' >> "$GITHUB_OUTPUT"
              echo 'Dry-run requested; packaging and readiness will run without publication.'
              exit 0
              ;;
            workflow_dispatch:false)
              RELEASE_KIND='manual-full-release'
              ;;
            schedule:false|repository_dispatch:false)
              RELEASE_KIND='scheduled-release'
              ;;
            *)
              echo 'Release event and dry-run inputs are not an allowed combination.' >&2
              exit 1
              ;;
          esac

          if [ "$GITHUB_REF" != 'refs/heads/main' ]; then
            echo 'Publishing is allowed only from refs/heads/main.' >&2
            exit 1
          fi

          CURRENT_HEAD="$(git rev-parse HEAD)"
          if [ "$CURRENT_HEAD" != "$BASE_HEAD" ]; then
            echo 'Addon checkout base HEAD changed during validation.' >&2
            exit 1
          fi
          REMOTE_MAIN_RECORD="$(git ls-remote --exit-code origin refs/heads/main)"
          read -r REMOTE_MAIN_HEAD REMOTE_MAIN_REF <<< "$REMOTE_MAIN_RECORD"
          if [ "$REMOTE_MAIN_REF" != 'refs/heads/main' ] || \
             [[ ! "$REMOTE_MAIN_HEAD" =~ ^([0-9a-f]{40}|[0-9a-f]{64})$ ]]; then
            echo 'Fresh origin/main lookup did not return one valid main ref.' >&2
            exit 1
          fi
          if [ "$BASE_HEAD" != "$REMOTE_MAIN_HEAD" ]; then
            echo 'Addon checkout base HEAD does not match fresh remote main.' >&2
            exit 1
          fi

          if [ "$RELEASE_KIND" = 'manual-full-release' ]; then
            echo 'continue=true' >> "$GITHUB_OUTPUT"
            echo 'publish=true' >> "$GITHUB_OUTPUT"
            echo 'repair=false' >> "$GITHUB_OUTPUT"
            echo 'reason=manual-full-release' >> "$GITHUB_OUTPUT"
            echo 'Manual full release requested; continuing even if bundled data is unchanged.'
          elif git diff --quiet HEAD -- QuickWoWTalentsData.lua; then
            echo 'continue=true' >> "$GITHUB_OUTPUT"
            echo 'publish=false' >> "$GITHUB_OUTPUT"
            echo 'repair=true' >> "$GITHUB_OUTPUT"
            echo 'reason=data-unchanged-release-check' >> "$GITHUB_OUTPUT"
            echo 'Validated bundled addon data is unchanged; verifying the existing tagged release and asset.'
          else
            DIFF_STATUS="$?"
            if [ "$DIFF_STATUS" -ne 1 ]; then
              echo 'Could not compare validated addon data with committed HEAD.' >&2
              exit "$DIFF_STATUS"
            fi
            echo 'continue=true' >> "$GITHUB_OUTPUT"
            echo 'publish=true' >> "$GITHUB_OUTPUT"
            echo 'repair=false' >> "$GITHUB_OUTPUT"
            echo 'reason=data-changed' >> "$GITHUB_OUTPUT"
            echo 'Validated bundled addon data changed; continuing release.'
          fi

      - name: Prepare next addon version
        id: prepare_version
        if: ${{ steps.release_gate.outputs.publish == 'true' }}
        env:
          RELEASE_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          if [ -n "$RELEASE_VERSION" ]; then
            npm run release:prepare -- --version "$RELEASE_VERSION"
          else
            npm run release:prepare
          fi

      - name: Resolve release version
        id: resolve_version
        if: ${{ steps.release_gate.outputs.continue == 'true' }}
        run: |
          set -euo pipefail
          VERSION="$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version")"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'package.json version must be plain semver.' >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "zip=dist/QuickWoWTalents-$VERSION.zip" >> "$GITHUB_OUTPUT"

      - name: Fail if tag already exists
        id: protect_tag
        if: ${{ steps.release_gate.outputs.publish == 'true' }}
        env:
          RELEASE_TAG: ${{ steps.resolve_version.outputs.tag }}
        run: |
          set -euo pipefail
          LOCAL_TAG="$(git tag --list "$RELEASE_TAG")"
          if [ -n "$LOCAL_TAG" ]; then
            echo "Tag $RELEASE_TAG already exists; refusing to overwrite a release." >&2
            exit 1
          fi
          REMOTE_TAG="$(git ls-remote --tags origin "refs/tags/$RELEASE_TAG")"
          if [ -n "$REMOTE_TAG" ]; then
            echo "Tag $RELEASE_TAG already exists; refusing to overwrite a release." >&2
            exit 1
          fi

      - name: Package addon zip
        id: package_addon
        if: ${{ steps.release_gate.outputs.continue == 'true' }}
        run: npm run package

      - name: Verify source and package readiness
        id: readiness
        if: ${{ steps.release_gate.outputs.continue == 'true' }}
        run: |
          set -euo pipefail
          READINESS_RESULT="$RUNNER_TEMP/qwt-release-readiness.json"
          npm run --silent release:verify -- \
            --options "$QWT_ADDON_OPTIONS_PATH" \
            --catalog "$QWT_TALENT_CATALOG_PATH" \
            --snapshot-manifest "$QWT_RELEASE_INPUT_MANIFEST_PATH" \
            --require-catalog-download \
            > "$READINESS_RESULT"
          node --input-type=module - "$READINESS_RESULT" "$GITHUB_OUTPUT" <<'NODE'
          import fs from 'node:fs';

          const [resultPath, outputPath] = process.argv.slice(2);
          const result = JSON.parse(fs.readFileSync(resultPath, 'utf8'));
          if (result.ok !== true || !/^[0-9a-f]{64}$/.test(result.zipSha256 ?? '')) {
            throw new Error('Release readiness did not return a valid zipSha256.');
          }
          fs.appendFileSync(outputPath, `zip_sha256=${result.zipSha256}\n`);
          console.log(`Release readiness verified for ${result.version}.`);
          NODE

      - name: Configure git author
        id: configure_git
        if: ${{ steps.release_gate.outputs.publish == 'true' }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Commit and tag verified release
        id: commit_release
        if: ${{ steps.release_gate.outputs.publish == 'true' }}
        env:
          RELEASE_TAG: ${{ steps.resolve_version.outputs.tag }}
        run: |
          set -euo pipefail
          git add package.json QuickWoWTalents.toc QuickWoWTalentsData.lua CHANGELOG.md CURSEFORGE_CHANGELOG.md
          git commit -m "Daily addon data release $RELEASE_TAG"
          git tag "$RELEASE_TAG"

      - name: Publish verified release
        id: publish_release
        if: ${{ steps.release_gate.outputs.publish == 'true' || steps.release_gate.outputs.repair == 'true' }}
        env:
          EXPECTED_SHA256: ${{ steps.readiness.outputs.zip_sha256 }}
          GH_TOKEN: ${{ github.token }}
          REPAIR_EXISTING: ${{ steps.release_gate.outputs.repair }}
          RELEASE_TAG: ${{ steps.resolve_version.outputs.tag }}
          RELEASE_VERSION: ${{ steps.resolve_version.outputs.version }}
          RELEASE_ZIP: ${{ steps.resolve_version.outputs.zip }}
        run: |
          set -euo pipefail
          if [ -s CURSEFORGE_CHANGELOG.md ]; then
            cp CURSEFORGE_CHANGELOG.md "$RUNNER_TEMP/release-notes.md"
          else
            awk -v heading="## $RELEASE_VERSION - " '
              /^## / {
                if (seen) exit
                if (index($0, heading) == 1) seen=1
              }
              seen { print }
            ' CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"
          fi

          if [ ! -s "$RUNNER_TEMP/release-notes.md" ]; then
            printf '%s\n\n%s\n' \
              'Automated daily Quick WoW Talents addon data refresh.' \
              'Bundled data is downloaded from the public Quick WoW Talents addon endpoint, then packaged as a static offline addon zip.' \
              > "$RUNNER_TEMP/release-notes.md"
          fi

          ACTUAL_SHA256="$(node --input-type=module -e \
            'import { createHash } from "node:crypto"; import { readFileSync } from "node:fs"; process.stdout.write(createHash("sha256").update(readFileSync(process.argv[1])).digest("hex"));' \
            "$RELEASE_ZIP")"
          if [ "$ACTUAL_SHA256" != "$EXPECTED_SHA256" ]; then
            echo 'Final release archive digest no longer matches the readiness result.' >&2
            exit 1
          fi
          gh auth setup-git
          if [ "$REPAIR_EXISTING" != 'true' ]; then
            git push --atomic origin \
              "HEAD:refs/heads/main" \
              "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
            gh release create "$RELEASE_TAG" "$RELEASE_ZIP" \
              --verify-tag \
              --title "QuickWoWTalents $RELEASE_TAG" \
              --notes-file "$RUNNER_TEMP/release-notes.md"
            exit 0
          fi

          RELEASE_ASSET_NAME="${RELEASE_ZIP##*/}"
          RELEASE_JSON="$RUNNER_TEMP/existing-release.json"
          EXISTING_RELEASE_DIR="$RUNNER_TEMP/existing-release"
          EXISTING_RELEASE_ZIP="$EXISTING_RELEASE_DIR/$RELEASE_ASSET_NAME"
          if gh release view "$RELEASE_TAG" --json assets,isDraft,isPrerelease > "$RELEASE_JSON" 2>/dev/null; then
            RELEASE_ASSESSMENT="$(node scripts/verify-github-release-asset.mjs \
              --metadata "$RELEASE_JSON" "$RELEASE_ASSET_NAME")"
            if [ "$RELEASE_ASSESSMENT" = 'repair' ]; then
              REPAIR_ACTION='repair'
            elif [ "$RELEASE_ASSESSMENT" = 'verify' ]; then
              mkdir -p "$EXISTING_RELEASE_DIR"
              gh release download "$RELEASE_TAG" \
                --pattern "$RELEASE_ASSET_NAME" \
                --dir "$EXISTING_RELEASE_DIR"
              RELEASE_VERIFIED="$(node scripts/verify-github-release-asset.mjs \
                "$RELEASE_JSON" "$RELEASE_ASSET_NAME" "$EXISTING_RELEASE_ZIP" "$GITHUB_WORKSPACE")"
              if [ "$RELEASE_VERIFIED" = 'true' ]; then
                echo "Verified existing release $RELEASE_TAG and asset $RELEASE_ASSET_NAME."
                exit 0
              fi
              REPAIR_ACTION='repair'
            else
              echo 'Existing release assessment returned an unexpected result.' >&2
              exit 1
            fi
          else
            REPAIR_ACTION='create'
          fi

          if ! REMOTE_TAG_RECORD="$(git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG")"; then
            echo "Cannot repair $RELEASE_TAG because its remote tag is missing." >&2
            exit 1
          fi
          read -r REMOTE_TAG_HEAD REMOTE_TAG_REF <<< "$REMOTE_TAG_RECORD"
          CURRENT_HEAD="$(git rev-parse HEAD)"
          if [ "$REMOTE_TAG_REF" != "refs/tags/$RELEASE_TAG" ] || [ "$REMOTE_TAG_HEAD" != "$CURRENT_HEAD" ]; then
            echo "Cannot repair $RELEASE_TAG because its remote tag does not identify current main." >&2
            exit 1
          fi

          if [ "$REPAIR_ACTION" = 'repair' ]; then
            gh release upload "$RELEASE_TAG" "$RELEASE_ZIP" --clobber
            gh release edit "$RELEASE_TAG" --draft=false --prerelease=false
          else
            gh release create "$RELEASE_TAG" "$RELEASE_ZIP" \
              --verify-tag \
              --title "QuickWoWTalents $RELEASE_TAG" \
              --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
